# ============================================================
# 信用卡产品爬虫 - Firecrawl + DeepSeek (Phase 5)
#
# 📋 手动触发方式:
#   1. https://github.com/HamQ/BankInfo/actions/workflows/card_firecrawl.yml
#   2. 点击 Run workflow → 填入银行代码 (逗号分隔, 留空=全部)
#   3. 点击绿色 Run workflow
#
# 💡 本地运行:
#   $env:FIRECRAWL_API_KEY="fc-xxx"
#   $env:DEEPSEEK_API_KEY="sk-xxx"
#   $env:SUPABASE_URL="https://xxx.supabase.co"
#   $env:SUPABASE_SERVICE_KEY="eyJhbG..."
#   python scripts/card_firecrawl.py [银行代码...]
# ============================================================

name: 信用卡产品爬虫 (Firecrawl+AI)

on:
  workflow_dispatch:
    inputs:
      banks:
        description: '银行代码 (逗号分隔, 留空=全部)'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 爬取卡片产品 (Firecrawl)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -z "${{ github.event.inputs.banks }}" ]; then
            python scripts/card_firecrawl.py
          else
            python scripts/card_firecrawl.py ${{ github.event.inputs.banks }}
          fi
